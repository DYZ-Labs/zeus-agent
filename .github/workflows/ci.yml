name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full repository check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # The build prefetches the embedding model; CI does not need 130MB of ONNX
      # weights to typecheck, lint, and test the code that loads them.
      ZEUS_SKIP_MODEL_PREFETCH: "1"
      # onnxruntime-node arrives as a plain dependency of @huggingface/transformers, and
      # its postinstall treats every linux/x64 install as a CUDA target: the three
      # provider libraries it wants are not in the npm tarball, so it fetches ~200MB from
      # api.nuget.org on a machine that will only ever run the CPU backend. The download
      # is started without being awaited or caught, which turns a nuget outage, throttle,
      # or slow mirror into an unhandled rejection, a failed postinstall, and a failed
      # `npm ci` — a red build and a blocked deploy caused by a third-party CDN we do not
      # depend on. "skip" is the value the install script tests for before it resolves any
      # feed, so nothing is requested at all. Do not remove this.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the full release gate
        run: npm run check

      - name: Verify checks did not rewrite tracked files
        run: git diff --exit-code
